<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> ❤️ازيك يا مريم</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

}

.card{

background:white;
padding:40px;
width:90%;
max-width:500px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
position:relative;

}

h1{

font-size:35px;
margin-bottom:20px;

}

p{

font-size:22px;
margin:20px 0;

}

img{

width:250px;
border-radius:20px;
margin:20px 0;

}

button{

padding:15px 35px;
border:none;
border-radius:30px;
font-size:20px;
cursor:pointer;
margin:10px;
transition:.3s;

}

.next{

background:#ff4b91;
color:white;

}

.next:hover{

transform:scale(1.1);

}

#yes{

background:#4CAF50;
color:white;

}

#no{

background:#ff4444;
color:white;
position:absolute;

}

#confetti{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
display:none;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<div id="step1">

<h1> 👋ازيك يا مريم</h1>


<button class="next" onclick="step2()">Hi 😊</button>

</div>

<div id="step2" class="hidden">

<p>عايز اقولك على سر 🤫🤫 </p>

<img src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif">

<br>

<button class="next" onclick="step3()">Tell me 👀</button>

</div>

<div id="step3" class="hidden">

<p>...هقول 😳</p>

<p> ❤️انا بحبك😍 </p>

<img src="https://media.giphy.com/media/3o7TKTDn976rzVgky4/giphy.gif">

<br>

<button id="yes">❤️ وانا كمان</button>

<button id="no">💔 مش بحبك</button>

</div>

<div id="step4" class="hidden">

<h1>😂❤️</h1>

<h2>!كنت عارف 😂 </h2>

<br>

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

</div>

</div>

<script>

const yes=document.getElementById("yes");
const no=document.getElementById("no");

function step2(){

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

}

function step3(){

document.getElementById("step2").style.display="none";
document.getElementById("step3").style.display="block";

moveNo();

}

yes.onclick=function(){

document.getElementById("step3").style.display="none";
document.getElementById("step4").style.display="block";

startConfetti();

}

function moveNo(){

let x=Math.random()*(window.innerWidth-150);
let y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";

}

no.addEventListener("mouseover",moveNo);
no.addEventListener("touchstart",moveNo);

function startConfetti(){

const canvas=document.getElementById("confetti");

canvas.style.display="block";

const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let pieces=[];

for(let i=0;i<180;i++){

pieces.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height-canvas.height,

r:Math.random()*8+4,

d:Math.random()*180,

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<pieces.length;i++){

let p=pieces[i];

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fillStyle=`hsl(${p.d},100%,50%)`;

ctx.fill();

p.y+=4;

if(p.y>canvas.height){

p.y=-10;

p.x=Math.random()*canvas.width;

}

}

requestAnimationFrame(draw);

}

draw();

}

</script>

</body>
</html>

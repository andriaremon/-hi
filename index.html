<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hallo  👋</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    background:white;
    padding:40px;
    width:90%;
    max-width:500px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    position:relative;
}

h1{
    font-size:35px;
    margin-bottom:20px;
}

p{
    font-size:22px;
    margin:20px 0;
}

img{
    width:250px;
    max-width:100%;
    border-radius:20px;
    margin:20px 0;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    margin:10px;
    transition:.3s;
}

.next{
    background:#ff4b91;
    color:white;
}

.next:hover{
    transform:scale(1.1);
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4444;
    color:white;
    position:absolute;
    z-index:10;
}

#confetti{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    display:none;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

    <!-- STEP 1 -->
    <div id="step1">

        <h1>Hallo  👋 </h1>

        <button class="next" onclick="step2()">
            Hi 😊
        </button>

    </div>


    <!-- STEP 2 -->
    <div id="step2" class="hidden">

        <p>Ich möchte dir etwas sagen...</p>

        <img src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif">

        <br>

        <button class="next" onclick="step3()">
            Sag es mir 👀
        </button>

    </div>


    <!-- STEP 3 -->
    <div id="step3" class="hidden">

        <p>Ähm... 😳</p>

        <p>❤️ 🙈ich mag dich</p>

        <img src="https://media.giphy.com/media/3o7TKTDn976rzVgky4/giphy.gif">

        <br>

        <button id="yes">
            ❤️Ich mag dich auch
        </button>

        <button id="no">
            💔 Nein
        </button>

    </div>


    <!-- STEP 4 -->
    <div id="step4" class="hidden">

        <h1>😂</h1>

        <h2>ICH WUSSTE, DASS DU MICH AUCH MAGST! 😂</h2>

        <br>

        
    </div>

</div>


<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");


// الانتقال للصفحة الثانية
function step2(){

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";

}


// الانتقال للصفحة الثالثة
function step3(){

    document.getElementById("step2").style.display = "none";
    document.getElementById("step3").style.display = "block";

}


// زر "وأنا كمان"
yes.onclick = function(){

    document.getElementById("step3").style.display = "none";
    document.getElementById("step4").style.display = "block";

    startConfetti();

};


// تحريك زر "مش بحبك"
function moveNo(){

    const buttonWidth = no.offsetWidth;
    const buttonHeight = no.offsetHeight;

    // مساحة آمنة داخل الشاشة
    const maxX = window.innerWidth - buttonWidth - 10;
    const maxY = window.innerHeight - buttonHeight - 10;

    const x = Math.max(10, Math.random() * maxX);
    const y = Math.max(10, Math.random() * maxY);

    no.style.left = x + "px";
    no.style.top = y + "px";
}


// على الكمبيوتر:
// الزر يتحرك فقط عند الضغط عليه
no.addEventListener("click", function(e){

    e.preventDefault();
    moveNo();

});


// على الموبايل:
// الزر يتحرك عند محاولة الضغط عليه
no.addEventListener("touchstart", function(e){

    e.preventDefault();
    moveNo();

});


// الكونفيتي 🎉
function startConfetti(){

    const canvas = document.getElementById("confetti");

    canvas.style.display = "block";

    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let pieces = [];

    for(let i = 0; i < 180; i++){

        pieces.push({

            x: Math.random() * canvas.width,

            y: Math.random() * canvas.height - canvas.height,

            r: Math.random() * 8 + 4,

            d: Math.random() * 180

        });

    }


    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        for(let i = 0; i < pieces.length; i++){

            let p = pieces[i];

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `hsl(${p.d},100%,50%)`;

            ctx.fill();

            p.y += 4;


            if(p.y > canvas.height){

                p.y = -10;

                p.x =
                    Math.random() * canvas.width;

            }

        }

        requestAnimationFrame(draw);

    }

    draw();

}


// لو حجم الشاشة اتغير
window.addEventListener("resize", function(){

    const canvas = document.getElementById("confetti");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
